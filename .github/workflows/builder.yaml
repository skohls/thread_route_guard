name: Build app images

on:
  push:
    branches: [main]
    paths:
      - "thread_route_guard/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    paths:
      - "thread_route_guard/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

env:
  APP: thread_route_guard

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ env.APP }}"

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Read version, base image and image name
        id: info
        run: |
          version=$(yq '.version' "$APP/config.yaml")
          image=$(yq '.image' "$APP/config.yaml" | sed "s/{arch}/${{ matrix.arch }}/")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$(yq '.build_from.${{ matrix.arch }}' "$APP/build.yaml")" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published versions are immutable: a version that already exists is not pushed again.
      - name: Check whether this version is already published
        id: published
        if: github.event_name != 'pull_request'
        run: |
          if docker manifest inspect "${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }} exists, build only"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP }}
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.info.outputs.base }}
          labels: |
            io.hass.type=addon
            io.hass.name=Thread Route Guard
            io.hass.version=${{ steps.info.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          push: ${{ github.event_name != 'pull_request' && steps.published.outputs.exists != 'true' }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
